[project]
name = "evals"
version = "0.1.0"
description = "Cortex eval harness — fixed corpus, golden set, retrieval metrics, reports"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.3,<4",
    "pgvector>=0.4,<1",
    "sentence-transformers>=5.3.0",
    "langchain-text-splitters>=0.3",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evalkit"]
