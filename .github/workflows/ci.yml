name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Ruff needs none of the project dependencies, so this runs in seconds.
      - name: Ruff
        run: uvx ruff check .

      # Fails if a dependency was added or removed without re-locking.
      - name: Lockfile is in sync
        run: uv lock --check

  go:
    name: Gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache-dependency-path: gateway/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The query handler is the only thing standing between an HTTP client and
      # two gRPC services, and its error mapping is easy to regress silently.
      - name: Test
        run: go test ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on: $unformatted"
            gofmt -d .
            exit 1
          fi

  test:
    name: Python tests
    runs-on: ubuntu-latest

    # The database layer can only be meaningfully tested against a real
    # PostgreSQL with pgvector: the schema, the HNSW index, the 384-dimension
    # vector column and the upsert conflict target are all enforced by the
    # server, not by Python. Same image and credentials as
    # infra/local/docker-compose.yml, so CI and a local run exercise the same
    # database.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cortex
          POSTGRES_PASSWORD: cortex_dev
          POSTGRES_DB: cortex
        ports:
          - 5432:5432
        # Without this the first test races Postgres's own startup and fails
        # intermittently with a connection refused.
        options: >-
          --health-cmd "pg_isready -U cortex"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Spelled out rather than relying on the defaults in conftest.py, so a
    # change to those defaults cannot silently repoint CI at the wrong database.
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: cortex
      DB_PASSWORD: cortex_dev
      DB_NAME: cortex

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # Pulls in sentence-transformers and therefore a CPU PyTorch wheel, so
      # this step dominates the job's runtime. The integration tests reuse this
      # environment rather than repeating the install in a second job.
      - name: Install dependencies
        run: uv sync --all-packages --frozen

      # The services share flat top-level module names (config, db, embedder,
      # llm), so only one service root can be on sys.path per run. Each suite
      # therefore gets its own pytest invocation rather than one combined sweep.
      - name: Ingestion unit tests
        run: uv run --frozen pytest services/ingestion -m "not integration" -q

      # Runs against the postgres service above. These cover schema creation,
      # the HNSW index, idempotent upserts and the foreign key — none of which a
      # unit test can assert.
      - name: Ingestion integration tests
        run: uv run --frozen pytest services/ingestion -m integration -q

      - name: Generator unit tests
        run: uv run --frozen pytest services/generator -q

      # First coverage for the retriever: contract validation, top_k fallback,
      # SQL shape via fakes, and query/document embedding parity. No database
      # needed — same job, separate invocation, per the sys.path note above.
      - name: Retriever unit tests
        run: uv run --frozen pytest services/retriever -q

      # Eval harness as steps, not a new job: the torch install and embedding
      # model above are reused, and this job's postgres service is the index.
      # Unit tests first (pure metric math + golden-lint tests, no DB).
      - name: Eval unit tests
        run: uv run --frozen pytest evals -q

      # The golden set lints itself: no verbatim copies, every positive has a
      # distractor, references resolve. A junk question fails here, not in scoring.
      - name: Golden set lint
        run: uv run --frozen python evals/lint_golden.py

      # Idempotent fixture load into the postgres service above.
      - name: Seed eval corpus
        run: uv run --frozen python evals/seed.py --via db

      # Warn-only until the golden set earns gating: EVAL_ENFORCE=enforce flips
      # a significant McNemar regression into a failure. Reports are written
      # either way so the trend is visible from day one.
      - name: Retrieval eval vs baseline
        env:
          EVAL_ENFORCE: warn
        run: uv run --frozen python evals/run.py --compare evals/baseline.json

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: |
            evals/reports/report.json
            evals/reports/report.md
          retention-days: 30
