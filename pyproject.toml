[project]
name = "cortex"
version = "0.1.0"
description = "Polyglot RAG engine: a Go API gateway over Python gRPC services, with pgvector retrieval and citation-validated LLM answers."
readme = "README.md"
authors = [{ name = "Ronnit Chopra", email = "choprar3@msu.edu" }]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["services/*"]

[tool.pytest.ini_options]
testpaths = ["services/ingestion/tests"]
# The three services share flat top-level module names (config, db, embedder),
# so only the service under test may be on sys.path.
pythonpath = ["services/ingestion"]
markers = ["integration: requires a running PostgreSQL + pgvector instance"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Protobuf/gRPC stubs under */gen/ are machine-generated by `make proto`.
extend-exclude = ["gen"]

[tool.ruff.lint]
select = ["E", "F", "I"]
