[project]
name = "generator"
version = "0.1.0"
description = "Cortex generator service — LLM API calls, context injection, citation validation via gRPC"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.62,<2",
    "grpcio-tools>=1.62,<2",
    "langchain-google-genai>=2.0.0",
    "langchain-core>=0.3",
    "pydantic>=2.6,<3",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
