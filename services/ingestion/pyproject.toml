[project]
name = "ingestion"
version = "0.1.0"
description = "Cortex ingestion worker — Kafka consumer, document parsing, chunking, embedding, pgvector upsert"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.62,<2",
    "grpcio-tools>=1.62,<2",
    "psycopg[binary]>=3.3,<4",
    "pgvector>=0.4,<1",
    "confluent-kafka>=2.4,<3",
    "sentence-transformers>=5.3.0",
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "boto3>=1.34,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a running PostgreSQL+pgvector instance"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["."]
